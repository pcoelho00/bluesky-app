[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bluesky-feed-summarizer"
version = "0.1.0"
description = "Python app to summarize Bluesky feeds using Claude AI."
authors = [
    { name = "pcoelho00" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "atproto>=0.0.61",
    "anthropic>=0.58.2",
    "click>=8.2.1",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "rich>=14.0.0",
    "libsql>=0.1.11"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
bluesky-summarizer = "bluesky_summarizer.cli:main"
